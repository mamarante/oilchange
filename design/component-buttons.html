<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #000000;
    padding: 32px;
    max-width: 420px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #666; margin: 0 0 24px; font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .btn {
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    line-height: 20px;
    cursor: default;
  }
  .btn.primary { background: #208AEF; color: #ffffff; }
  .btn.destructive { background: #B42318; color: #ffffff; }
  .btn.secondary { background: transparent; color: #208AEF; border: 1px solid #208AEF; }
  .btn.disabled { opacity: 0.5; }
  .caption { font-size: 12px; color: #888; margin-top: -8px; margin-bottom: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <h1>Buttons</h1>
  <p class="sub">PrimaryButton variants — src/components/primary-button.tsx</p>
  <div class="stack">
    <div class="btn primary">Log Oil Change</div>
    <div class="caption">variant="primary" — #208AEF</div>

    <div class="btn secondary">Update Odometer</div>
    <div class="caption">variant="secondary" — outline, #208AEF</div>

    <div class="btn destructive">Delete Vehicle</div>
    <div class="caption">variant="destructive" — #B42318</div>

    <div class="btn primary disabled">Saving…</div>
    <div class="caption">disabled — opacity 0.5</div>
  </div>
</body>
</html>
