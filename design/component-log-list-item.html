<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Log List Item</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #000000;
    padding: 32px;
    max-width: 420px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #666; margin: 0 0 24px; font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row {
    background: #F0F0F3;
    border-radius: 16px;
    padding: 16px;
  }
  .line { display: flex; justify-content: space-between; }
  .date { font-size: 14px; font-weight: 700; line-height: 20px; }
  .mileage { font-size: 14px; font-weight: 500; line-height: 20px; color: #60646C; }
  .meta { font-size: 14px; font-weight: 500; line-height: 20px; color: #60646C; margin-top: 2px; }
  .notes { font-size: 16px; font-weight: 500; line-height: 24px; margin-top: 2px; }
</style>
</head>
<body>
  <h1>Log List Item</h1>
  <p class="sub">Service history row — src/components/log-list-item.tsx</p>
  <div class="stack">
    <div class="row">
      <div class="line"><span class="date">Jul 17, 2026</span><span class="mileage">40,000 mi</span></div>
      <div class="meta">Full Synthetic · Mobil 1</div>
      <div class="meta">Filter: Fram</div>
    </div>
    <div class="row">
      <div class="line"><span class="date">Jan 12, 2026</span><span class="mileage">35,200 mi</span></div>
      <div class="meta">Synthetic Blend · Valvoline</div>
      <div class="notes">Also rotated tires while in the shop.</div>
    </div>
  </div>
</body>
</html>
