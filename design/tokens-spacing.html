<!doctype html>
<html lang="en">
<head>

<title>Spacing</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #000000;
    padding: 32px;

  .row .value { width: 40px; flex-shrink: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #aaa; }

<body>
  <h1>Spacing</h1>
